daily_search:
  enabled: true
  request_timeout_seconds: 8
  keyword_concurrency: 2
  keywords: []
  max_results_per_keyword: 3
  sources:
  - openalex
  - openaire
  - dblp
model: deepseek-flash
vision_model: deepseek-flash
agent:
  verify_timeout_seconds: 8
api_resilience:
  max_concurrency: 4
  interactive_reserved_slots: 1
  queue_size: 20
  connect_timeout_seconds: 3.05
  read_timeout_seconds: 30
  request_deadline_seconds: 45
  max_retries: 2
  circuit_failure_threshold: 3
  circuit_recovery_seconds: 120
pdf:
  max_pages: 20
rag:
  enabled: true
  embedding:
    # 换嵌入模型只需改这里，无需改代码。
    # 可选：all-MiniLM-L6-v2（384维/256token，CPU 友好）
    #       Qwen/Qwen3-Embedding-0.6B（1024维/32k，支持 MRL 降维）
    model: all-MiniLM-L6-v2
    # 目标维度。Qwen3 支持 MRL，可降到 512/256 以省存储；填 0 表示用模型原生维度。
    dimensions: 384
    # 单个块的 token 上限，超过会被模型截断。Qwen3 可设 8192。
    max_length: 256
    batch_size: 32
    device: cpu
    # 集合名。换模型迁移时先建 papers_v2，验证通过后改这里切换；
    # 出问题改回 papers 即可回滚（旧集合不会被删除）。
    collection: papers_v2
  reranker:
    # 首次使用先运行 scripts/warm_reranker.py；运行时只从本地缓存加载。
    enabled: true
    model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    candidate_limit: 20
ui:
  port: 7860
  theme: soft
