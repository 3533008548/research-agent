daily_search:
  enabled: true
  request_timeout_seconds: 8
  keyword_concurrency: 2
  keywords: []
  max_results_per_keyword: 3
  sources:
  - openalex
  - openaire
  - dblp
model: deepseek-flash
vision_model: deepseek-flash
agent:
  verify_timeout_seconds: 8
api_resilience:
  max_concurrency: 4
  interactive_reserved_slots: 1
  queue_size: 20
  connect_timeout_seconds: 3.05
  read_timeout_seconds: 30
  request_deadline_seconds: 45
  max_retries: 2
  circuit_failure_threshold: 3
  circuit_recovery_seconds: 120
pdf:
  max_pages: 20
rag:
  enabled: true
  embedding:
    # 换嵌入模型只需改这里，无需改代码。
    # 可选：all-MiniLM-L6-v2（384维/256token，CPU 友好）
    #       Qwen/Qwen3-Embedding-0.6B（1024维/32k，支持 MRL 降维）
    model: all-MiniLM-L6-v2
    # 目标维度。Qwen3 支持 MRL，可降到 512/256 以省存储；填 0 表示用模型原生维度。
    dimensions: 384
    # 单个块的 token 上限，超过会被模型截断。
    # 256 只是 sentence-transformers / ChromaDB 的约定：MiniLM 的 ONNX 图
    # 实际有 512 个位置编码（实测 512 可跑、514 报广播失败）。
    # 放开到 512 后，原始逻辑块（中位 247 token）基本不用再被守卫切开，
    # 段落级 R@1 从 5.9% 回到 38.2%，块数少 31%。Qwen3 可设更大。
    max_length: 512
    batch_size: 32
    device: cpu
    # 集合名。papers 是 512 上限重建后的版本（17 篇 / 794 块）。
    # 256 上限的旧集合 papers_v2 已删除：需要回退时把 max_length 改回 256，
    # 再用 scripts/build_length_probe.py 重建即可（约 48 秒），
    # 原始分块数据始终保留在 runtime/derived/paper_artifacts/*/document_map.json。
    collection: papers
  reranker:
    # 首次使用先运行 scripts/warm_reranker.py；运行时只从本地缓存加载。
    enabled: true
    model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    candidate_limit: 20
ui:
  port: 7860
  theme: soft
