daily_search:
  enabled: true
  request_timeout_seconds: 8
  keyword_concurrency: 2
  keywords: []
  max_results_per_keyword: 3
  sources:
  - openalex
  - openaire
  - dblp
model: deepseek-flash
vision_model: deepseek-flash
agent:
  verify_timeout_seconds: 8
api_resilience:
  max_concurrency: 4
  interactive_reserved_slots: 1
  queue_size: 20
  connect_timeout_seconds: 3.05
  read_timeout_seconds: 30
  request_deadline_seconds: 45
  max_retries: 2
  circuit_failure_threshold: 3
  circuit_recovery_seconds: 120
pdf:
  max_pages: 20
rag:
  enabled: true
  embedding:
    # 换嵌入模型只需改这里，无需改代码。
    # 可选：intfloat/multilingual-e5-small（384维/512token，中英同空间，当前默认）
    #       all-MiniLM-L6-v2（384维/512token，英文单语，中文查询近乎噪声）
    #       Qwen/Qwen3-Embedding-0.6B（1024维/32k，支持 MRL 降维；CPU 上比 MiniLM
    #       慢约两个数量级，全库重建要几十分钟）
    model: intfloat/multilingual-e5-small
    # 目标维度。e5 未经 Matryoshka 训练，不支持降维；填错会被纠正为模型原生 384。
    # Qwen3 支持 MRL，可降到 512/256 以省存储。
    dimensions: 384
    # 单个块的 token 上限，超过会被模型截断。
    # 256 只是 sentence-transformers / ChromaDB 的约定：MiniLM 的 ONNX 图
    # 实际有 512 个位置编码（实测 512 可跑、514 报广播失败）。
    # 放开到 512 后，原始逻辑块（中位 247 token）基本不用再被守卫切开，
    # 段落级 R@1 从 5.9% 回到 38.2%，块数少 31%。Qwen3 可设更大。
    max_length: 512
    batch_size: 32
    device: cpu
    # 集合名。papers_e5 是用 multilingual-e5-small 重建的版本（17 篇 / 796 块）。
    # 换嵌入模型必须换集合：向量空间变了，旧集合的向量不可比。
    #   python scripts/migrate_embedding.py --source papers --target <新名> \
    #       --model <模型> --max-length 512   # 约 52 秒，源集合保留作回滚备份
    # 旧集合 papers（all-MiniLM-L6-v2 / 512 token / 794 块）暂时保留，确认无误后可删。
    # 原始分块数据始终保留在 runtime/derived/paper_artifacts/*/document_map.json。
    collection: papers_e5
  reranker:
    # 首次使用先运行 scripts/warm_reranker.py；运行时只从本地缓存加载。
    enabled: true
    model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    # 送进重排的候选条数。工具层 top_k 上限只有 5，20 条明显过量。
    # 34 条金标实测：12 条时质量与 20 条**完全一致**（段落级 R@1 79.4%），
    # 降到 8 条才会掉到 70.6%。所以 12 是"质量不降"的临界点。
    candidate_limit: 12
    # cross-encoder 的输入截断长度。我们的块中位约 219 token，
    # 大部分用不满 512；实测 512→256 质量零损失（MRR 0.8245→0.8309）。
    max_length: 256
ui:
  port: 7860
  theme: soft

# ── 外部 MCP 服务（消费别人的 MCP Server） ──────────────────────────────
# 默认关闭。是否连到外部进程是运维的决定，不由 Agent 自行决定。
# 接入后的工具会以 mcp__<服务名>__<工具名> 的形式出现在工具列表里，
# 并自动继承现有的熔断、超时、取消与结果长度限制——因为它们走的是同一条
# 工具执行路径，而不是另开一套。
mcp:
  enabled: false
  # 单次工具调用的超时上限（秒）。
  tool_timeout_seconds: 30
  # 连续失败多少次后熔断该服务；熔断窗口（秒）过后放行一个探测请求。
  # 复用项目既有的 resilience.CircuitBreaker，不是另写一套。
  circuit_failure_threshold: 3
  circuit_recovery_seconds: 120
  servers:
    # 示例：连到本项目自己的 MCP Server（mcp_server.py），做一次自洽验证。
    # 真实场景可换成 uvx arxiv-mcp-server 之类的第三方服务。
    # - name: arxiv
    #   command: uvx
    #   args: ["arxiv-mcp-server"]
    #   # 只开放指定工具；留空表示开放该服务全部工具（仅适用于可信服务）。
    #   allowed_tools: ["search_papers"]
    #   timeout_seconds: 30
    # - name: local
    #   command: python
    #   args: ["mcp_server.py"]
    #   env:
    #     PYTHONPATH: "."
