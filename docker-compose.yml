services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ./runtime/derived/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # AOF rewrites the whole log on a fork, so a growing dataset can transiently
    # double Redis's footprint.  Cap it so that cannot starve the app containers.
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    restart: unless-stopped

  research-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
    image: research-agent:local
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /app/runtime
      REDIS_URL: redis://redis:6379/0
      # API_AUTH_TOKEN protects /api/v1/* with X-API-Key or Bearer auth.
      # Set API_AUTH_REQUIRED=1 for every public or reverse-proxy deployment.
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED:-0}
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    ports:
      # Keep the default local-only. Put a TLS reverse proxy in front before
      # publishing the service, and require API authentication there as well.
      - "127.0.0.1:${UI_PORT:-7860}:7860"
    volumes:
      - ./runtime:/app/runtime
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    # Resource ceilings.  Measured idle usage is ~170 MiB here, but a retrieval
    # burst loads the ONNX encoder plus the cross-encoder reranker, and a
    # large-corpus lexical scan allocates postings for the whole collection.
    # Without a ceiling one runaway request can exhaust host memory, and the
    # kernel OOM killer may terminate an unrelated process instead -- Docker
    # would only report "container exited" with no explanation.
    # Raise these if you switch to Qwen3 embeddings: they are ~48x slower on
    # CPU than MiniLM and hold substantially more memory.
    mem_limit: ${AGENT_MEM_LIMIT:-2g}
    mem_reservation: ${AGENT_MEM_RESERVE:-512m}
    cpus: ${AGENT_CPUS:-2.0}
    depends_on:
      redis:
        condition: service_healthy

  api-worker:
    image: research-agent:local
    command: ["python", "api_worker.py"]
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /app/runtime
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    volumes:
      - ./runtime:/app/runtime
    init: true
    # The image-level health check probes the ASGI HTTP port, which this
    # queue-only process intentionally does not expose.
    healthcheck:
      disable: true
    restart: unless-stopped
    stop_grace_period: 30s
    # This process is the one that actually runs retrieval and reranking, so it
    # gets the larger budget; the web process stays lean on purpose.
    mem_limit: ${WORKER_MEM_LIMIT:-3g}
    mem_reservation: ${WORKER_MEM_RESERVE:-768m}
    cpus: ${WORKER_CPUS:-2.0}
    depends_on:
      redis:
        condition: service_healthy
